name: Report an erratum
description: Report a factual, technical, translation, or presentation problem in the book.
title: "[Erratum] "
labels:
  - erratum
body:
  - type: input
    id: page
    attributes:
      label: Page URL or chapter
      placeholder: https://imbrooklyn.dev/books/understanding-llms/zh-hans/ch-01/
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Problem type
      options:
        - Factual or technical error
        - Translation mismatch
        - Broken example or code
        - Accessibility or presentation issue
        - Broken link or citation
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What is wrong and what should it say instead?
    validations:
      required: true
