name: Validate book

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout book
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python for book behavior checks
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'

      - name: Install book validation dependencies
        run: python -m pip install -r code/part-vii/requirements-ci.txt

      - name: Validate and build
        run: pnpm ci:build
